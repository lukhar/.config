set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# work around for: https://github.com/tmux-plugins/tmux-resurrect/issues/94
set -g default-command "/bin/zsh"

# scrolling
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

set -s escape-time 0

# split windows like vim
# vim's definition of a horizontal/vertical split is reversed from tmux's
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# switch between two latest windows
bind-key ^ last-window

bind-key S choose-session

# move around panes with hjkl, as one would in vim after pressing ctrl-w
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes like vim
# feel free to change the "1" to however many lines you want to resize by, only
# one at a time can be slow
bind < resize-pane -L 5
bind > resize-pane -R 5
bind - resize-pane -D 5
bind + resize-pane -U 5

# bind : to command-prompt like vim
# this is the default in tmux already
bind : command-prompt

# reload config
bind r source-file ~/.config/tmux/tmux.conf

# send the same command to all panes/windows/sessions
bind A command-prompt -p "Command:" \
       "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# enable focus events
set -g focus-events on

# vi-style controls for copy mode
setw -g mode-keys vi
unbind p
bind p paste-buffer
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi Escape send -X cancel
bind-key -Tcopy-mode-vi V send -X rectangle-toggle

# clipboard, natively instead of tmux-yank. set-clipboard uses OSC 52, so copying
# works through ssh; copy-command is what an argument-less copy-pipe pipes to.
set -s set-clipboard on
if-shell 'uname | grep -q Darwin' \
  'set -s copy-command "pbcopy"' \
  'set -s copy-command "wl-copy 2>/dev/null || xclip -selection clipboard"'

bind-key -Tcopy-mode-vi y send -X copy-pipe-and-cancel
bind-key -Tcopy-mode-vi Y send -X copy-pipe-and-cancel 'tmux paste-buffer -p'
bind-key -Tcopy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
# prefix y copies the current command line, prefix Y the pane's path. Both were
# tmux-yank; Y reuses copy-command so it stays platform-agnostic.
bind-key y copy-mode \; send -X start-of-line \; send -X begin-selection \; send -X end-of-line \; send -X copy-pipe-and-cancel
bind-key Y run-shell 'printf %s "#{pane_current_path}" | $(tmux show-options -svq copy-command)'

# open the selection, natively instead of tmux-open. Both run from the pane's cwd
# so relative paths resolve.
if-shell 'uname | grep -q Darwin' \
  "bind-key -Tcopy-mode-vi o send -X copy-pipe-and-cancel 'xargs -I{} tmux run-shell -b \"cd #{pane_current_path}; open {}\"'" \
  "bind-key -Tcopy-mode-vi o send -X copy-pipe-and-cancel 'xargs -I{} tmux run-shell -b \"cd #{pane_current_path}; xdg-open {}\"'"
bind-key -Tcopy-mode-vi C-o send -X copy-pipe-and-cancel 'xargs -I{} tmux send-keys "$EDITOR -- {}" C-m'

# remap crtl+b to crtl+a
unbind C-b
set -g prefix C-a

# don't rename windows automatically
set-option -g allow-rename off

# history size
set-option -g history-limit 30000

# index from 1 instead 0
set -g base-index 1

# max session title size
set -g status-left-length 25
set -g status-right-length 45

set-option -g status-right '%Y-%m-%d %H:%M | #(TZ=UTC date +%%H:%%M)'

#### COLOUR
set -g @theme dark
source-file ~/.config/tmux/themes/dark.conf

# prefix T flips between dark and light
bind b if-shell '[ "#{@theme}" = dark ]' \
  'set -g @theme light; source-file ~/.config/tmux/themes/light.conf' \
  'set -g @theme dark;  source-file ~/.config/tmux/themes/dark.conf'

#### PLUGINS

# vim-tmux-navigator, inlined: its tmux half does nothing but install these
# bindings, so there is no reason to manage it. The nvim half stays with lazy.
# is_vim asks whether the pane is running vim, in which case C-hjkl is passed
# through to it instead of switching tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys 'C-h'" 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" "send-keys 'C-j'" 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" "send-keys 'C-k'" 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" "send-keys 'C-l'" 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" 'select-pane -l'
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key C-l send-keys 'C-l'            # prefix C-l still clears the screen

# tmux-resurrect is the only plugin left, so there is no plugin manager: it is
# cloned on first run and pinned. Upstream has had no commits since 2023-03, and
# its newest tag (v4.0.0, 2022-04) is 18 commits *behind* master, so the pin is a
# commit rather than a tag. To move it, delete the directory and restart tmux.
if-shell '[ ! -d ~/.config/tmux/plugins/resurrect ]' \
  'run-shell "git clone -q https://github.com/tmux-plugins/tmux-resurrect ~/.config/tmux/plugins/resurrect && git -C ~/.config/tmux/plugins/resurrect checkout -q cff343c"'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.cache/tmux/'
run-shell ~/.config/tmux/plugins/resurrect/resurrect.tmux
