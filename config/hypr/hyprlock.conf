# Lock screen. Started by hypridle's lock_cmd (Super+L, idle, before sleep).
# Stuck? Ctrl+Alt+F2, log in, `pkill hyprlock`.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1d2021ff)
}

label {
    monitor =
    text = $TIME
    font_family = DejaVuSansM Nerd Font Mono
    font_size = 64
    color = rgba(ebdbb2ff)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    font_family = DejaVuSansM Nerd Font Mono
    placeholder_text = password
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
