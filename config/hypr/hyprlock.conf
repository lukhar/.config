# Lock screen. Started by hypridle's lock_cmd (Super+L, idle, before sleep).
# Stuck? Ctrl+Alt+F2, log in, `pkill hyprlock`.
# Solarized dark, like config/waybar/style.css.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(002b36)
}

label {
    monitor =
    text = $TIME
    font_family = DejaVuSansM Nerd Font Mono
    font_size = 64
    color = rgb(93a1a1)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    font_family = DejaVuSansM Nerd Font Mono
    placeholder_text = password
    outer_color = rgb(073642)
    inner_color = rgb(002b36)
    font_color = rgb(93a1a1)
    check_color = rgb(268bd2)
    fail_color = rgb(dc322f)
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
