# Idle and sleep. Run by the hypridle user service (NixOS services.hypridle),
# which starts with the uwsm session.
#
# dpms goes through the lua dispatcher: `hyprctl dispatch dpms off` is the old
# hyprlang syntax and fails under hyprland.lua. Explicit on/off, never a bare
# string -- hl.dsp.dpms("on") toggles.

general {
    # one hyprlock at a time, whoever asks: idle, Super+L, sleep
    lock_cmd = pidof hyprlock || hyprlock
    # lock before suspend, so the lid never opens onto an unlocked session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off, back on at the first input
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min: suspend, like closing the lid: hibernate after 2h on battery
# (HibernateDelaySec in hosts/framework/default.nix), plain suspend on AC
listener {
    timeout = 900
    on-timeout = systemctl suspend-then-hibernate
}
