# Wi-Fi menu for the Framework laptop (Super+W, or click waybar's network
# module): networkmanager_dmenu drawing its lists and the password prompt in
# rofi, with the same solarized theme as the launcher. Linked by
# hosts/framework/home.nix. Reference: share/doc/networkmanager_dmenu/config.ini.example

[dmenu]
dmenu_command = rofi -dmenu -i -theme ~/.config/rofi/solarized.rasi
# rofi marks the active connection itself
highlight = True
compact = True
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
list_saved = True
prompt = Wi-Fi

[dmenu_passphrase]
# rofi -password: dots instead of the typed text
obscure = True
show_pass = alacritty --hold -e nmcli device wifi show-password

# "Launch Connection Manager": nmtui in alacritty (networkmanagerapplet, with
# the GUI editor, isn't installed: it autostarts a duplicate tray icon)
[editor]
terminal = alacritty
gui_if_available = False

[nmdm]
rescan_delay = 5
